{% extends "base.html" %}
{% block title_suffix %}// GEX{% endblock %}

{% block head %}
<script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
{% endblock %}

{% block content %}
<style>
.gex-controls { display:flex; gap:12px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
.gex-controls label { font-size:12px; color:var(--text-dim); }
.gex-controls select, .gex-controls input { font-size:12px; padding:3px 8px; background:var(--bg-card); border:1px solid var(--border); color:var(--text); border-radius:4px; }
.gex-btn { font-size:11px; padding:4px 12px; background:var(--bg-card); border:1px solid var(--border); color:var(--text-dim); border-radius:4px; cursor:pointer; }
.gex-btn:hover { color:var(--text); }
#gex-exp-picker { margin-bottom:10px; display:flex; flex-wrap:wrap; align-items:center; gap:0; max-height:90px; overflow-y:auto; }
.exp-chip { display:inline-block; font-size:11px; padding:3px 8px; margin:2px; border:1px solid var(--border); border-radius:4px; color:var(--text-dim); cursor:pointer; background:var(--bg-card); }
.exp-chip.on { background:var(--primary); color:#fff; border-color:var(--primary); }
.exp-chip:hover { color:var(--text); }
.exp-reset { font-size:11px; color:var(--text-faint); cursor:pointer; margin-left:8px; }
.exp-reset:hover { color:var(--text); }
.gex-cards { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.gex-card { background:var(--bg-card); border:1px solid var(--border); border-radius:6px; padding:8px 14px; min-width:120px; }
.gex-card .lbl { font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.5px; }
.gex-card .val { font-size:16px; font-weight:700; margin-top:2px; }
.regime-pos { color:#10b981; }
.regime-neg { color:#ef4444; }
.gex-table { width:100%; border-collapse:collapse; font-size:11px; }
.gex-table th { padding:4px 6px; text-align:right; color:var(--text-faint); border-bottom:1px solid var(--border); font-weight:400; cursor:pointer; user-select:none; }
.gex-table th:first-child { text-align:left; }
.gex-table td { padding:2px 6px; text-align:right; }
.gex-table tr { cursor:pointer; }
.gex-table tr:hover { background:rgba(255,255,255,0.04); }
.pos { color:#10b981; }
.neg { color:#ef4444; }
.badge-stale { background:rgba(245,158,11,0.2); color:#f59e0b; padding:2px 8px; border-radius:4px; font-size:11px; }
.disclosure { font-size:10px; color:var(--text-faint); margin-top:10px; line-height:1.5; border-top:1px solid var(--border); padding-top:8px; }
#gex-drill { margin-top:10px; }
</style>

<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap;">
    <h2 class="page-title" style="margin:0;">Options · GEX</h2>
    <div class="gex-controls">
        <span style="display:flex;gap:0;">
            <button class="gex-btn" onclick="selectSym('SPY')" style="border-radius:4px 0 0 4px;">SPY</button>
            <button class="gex-btn" onclick="selectSym('QQQ')" style="border-radius:0;">QQQ</button>
            <button class="gex-btn" onclick="selectSym('IWM')" style="border-radius:0;">IWM</button>
            <button class="gex-btn" onclick="selectSym('^NDX')" style="border-radius:0 4px 4px 0;">NDX</button>
        </span>
        <input type="text" id="gex-sym" value="{{ default_sym }}" style="width:80px;text-transform:uppercase;" onkeydown="if(event.key==='Enter')loadSymbol()">
        <button class="gex-btn" onclick="loadSymbol()">Go</button>
        <label>Band:</label>
        <select id="gex-band" onchange="loadGEX()">
            <option value="5">±5%</option>
            <option value="10">±10%</option>
            <option value="15" selected>±15%</option>
            <option value="25">±25%</option>
            <option value="all">All</option>
        </select>
        <button class="gex-btn" onclick="loadGEX(true)" title="Force refetch">&#8635; Refresh</button>
        <span id="gex-spot" style="font-size:13px;font-weight:600;color:var(--text);"></span>
        <span id="gex-stale"></span>
    </div>
</div>

<div id="gex-exp-picker"></div>

<div class="gex-cards" id="gex-cards"></div>

<div style="display:flex;gap:10px;align-items:flex-start;">
    <div id="gex-chart" style="flex:2;height:600px;min-width:0;"></div>
    <div id="gex-table-wrap" style="flex:1;max-height:600px;overflow-y:auto;"></div>
</div>

<div id="gex-drill"></div>

<div class="disclosure" id="gex-disclosure"></div>

<script>
var _sym = '{{ default_sym }}';
var _profile = null;
var _selectedExps = null;   // null = let backend pick the first 4 (default)
var _sortKey = 'strike', _sortDir = 1;
var DARK = {paper_bgcolor:'#0a0a0e',plot_bgcolor:'#0a0a0e',font:{color:'#888',family:'JetBrains Mono,monospace',size:11},
    xaxis:{gridcolor:'#1a1a2a',linecolor:'#1a1a2a',zerolinecolor:'#333'},
    yaxis:{gridcolor:'#1a1a2a',linecolor:'#1a1a2a'},margin:{l:55,r:20,t:40,b:40}};

function fmtGex(v) {
    var a = Math.abs(v), s = v < 0 ? '-' : '';
    if (a >= 1e9) return s + '$' + (a/1e9).toFixed(2) + 'Bn';
    if (a >= 1e6) return s + '$' + (a/1e6).toFixed(1) + 'M';
    if (a >= 1e3) return s + '$' + (a/1e3).toFixed(0) + 'K';
    return s + '$' + a.toFixed(0);
}

function selectSym(sym) {
    document.getElementById('gex-sym').value = sym;
    loadSymbol();
}

// Symbol change -> drop the expiration selection so the new symbol defaults to first 4.
function loadSymbol() {
    _selectedExps = null;
    loadGEX();
}

function expsParam() {
    return (_selectedExps && _selectedExps.length)
        ? '&exps=' + encodeURIComponent(_selectedExps.join(',')) : '';
}

function loadGEX(refresh) {
    _sym = document.getElementById('gex-sym').value.toUpperCase().trim();
    var band = document.getElementById('gex-band').value;
    var url = '/api/options/gex/' + encodeURIComponent(_sym) + '?band=' + band
              + expsParam() + (refresh ? '&refresh=1' : '');
    document.getElementById('gex-spot').textContent = 'Loading…';
    document.getElementById('gex-chart').innerHTML = '<span style="color:#666;padding:20px;">Computing GEX…</span>';
    document.getElementById('gex-drill').innerHTML = '';
    fetch(url).then(function(r){return r.json();}).then(function(d) {
        if (d.error) {
            document.getElementById('gex-spot').textContent = '';
            document.getElementById('gex-chart').innerHTML = '<span style="color:#f33;padding:20px;">' + d.error + '</span>';
            document.getElementById('gex-cards').innerHTML = '';
            document.getElementById('gex-table-wrap').innerHTML = '';
            return;
        }
        _profile = d;
        if (!_selectedExps) _selectedExps = (d.expirations || []).slice();
        document.getElementById('gex-spot').textContent = _sym + ' $' + d.spot;
        var stale = document.getElementById('gex-stale');
        stale.innerHTML = d.meta && d.meta.stale ? '<span class="badge-stale">STALE · ' + (d.meta.warning||'') + '</span>' : '';
        renderExpPicker(d);
        renderCards(d);
        renderChart(d);
        renderTable(d);
        renderDisclosure(d);
    }).catch(function(e) {
        document.getElementById('gex-chart').innerHTML = '<span style="color:#f33;padding:20px;">' + e.message + '</span>';
    });
}

function renderExpPicker(d) {
    var avail = d.available_expirations || [];
    var sel = _selectedExps || [];
    var today = new Date();
    var h = '<span style="font-size:11px;color:var(--text-faint);margin-right:6px;">Expirations ('+sel.length+'):</span>';
    avail.forEach(function(e) {
        var on = sel.indexOf(e) >= 0;
        var dte = Math.max(0, Math.round((new Date(e + 'T00:00:00') - today) / 86400000));
        h += '<span class="exp-chip' + (on ? ' on' : '') + '" onclick="toggleExp(\'' + e + '\')">'
             + e.slice(5) + ' <span style="opacity:.6;">' + dte + 'd</span></span>';
    });
    h += '<span class="exp-reset" onclick="resetExps()">↺ first 4</span>';
    document.getElementById('gex-exp-picker').innerHTML = h;
}

function toggleExp(e) {
    if (!_selectedExps) _selectedExps = _profile ? (_profile.expirations || []).slice() : [];
    var i = _selectedExps.indexOf(e);
    if (i >= 0) {
        if (_selectedExps.length <= 1) return;   // keep at least one expiration
        _selectedExps.splice(i, 1);
    } else {
        _selectedExps.push(e);
    }
    // keep chronological order using the available-expirations ordering
    var av = (_profile && _profile.available_expirations) || [];
    _selectedExps.sort(function(a, b) { return av.indexOf(a) - av.indexOf(b); });
    loadGEX();
}

function resetExps() {
    _selectedExps = (_profile && _profile.default_expirations)
        ? _profile.default_expirations.slice() : null;
    loadGEX();
}

function renderCards(d) {
    var regimeCls = d.regime === 'positive' ? 'regime-pos' : 'regime-neg';
    var regimeTxt = d.regime === 'positive' ? 'POSITIVE · stabilizing' : 'NEGATIVE · trending';
    var h = '';
    h += '<div class="gex-card"><div class="lbl">Total GEX</div><div class="val ' + regimeCls + '">' + fmtGex(d.total_gex) + '</div></div>';
    h += '<div class="gex-card"><div class="lbl">Regime</div><div class="val ' + regimeCls + '" style="font-size:13px;">' + regimeTxt + '</div></div>';
    h += '<div class="gex-card"><div class="lbl">Gamma Flip</div><div class="val" style="color:#a78bfa;">' + (d.flip != null ? '$' + d.flip : '—') + '</div></div>';
    h += '<div class="gex-card"><div class="lbl">Call Wall</div><div class="val pos">' + (d.call_wall != null ? '$' + d.call_wall : '—') + '</div></div>';
    h += '<div class="gex-card"><div class="lbl">Put Wall</div><div class="val neg">' + (d.put_wall != null ? '$' + d.put_wall : '—') + '</div></div>';
    document.getElementById('gex-cards').innerHTML = h;
}

function renderChart(d) {
    document.getElementById('gex-chart').innerHTML = '';  // clear loading placeholder
    var strikes = d.strikes.map(function(s){return s.strike;});
    var net = d.strikes.map(function(s){return s.net_gex;});
    var colors = net.map(function(g){return g >= 0 ? '#10b981' : '#ef4444';});

    var shapes = [
        {type:'line', xref:'paper', x0:0, x1:1, y0:d.spot, y1:d.spot, line:{color:'#f59e0b',dash:'dot',width:1.5}},
    ];
    var annos = [
        {xref:'paper', x:1, y:d.spot, text:'Spot $'+d.spot, showarrow:false, font:{color:'#f59e0b',size:10}, xanchor:'right', yanchor:'bottom'},
    ];
    if (d.flip != null) {
        shapes.push({type:'line', xref:'paper', x0:0, x1:1, y0:d.flip, y1:d.flip, line:{color:'#a78bfa',dash:'dash',width:1.5}});
        annos.push({xref:'paper', x:0, y:d.flip, text:'Flip $'+d.flip, showarrow:false, font:{color:'#a78bfa',size:10}, xanchor:'left', yanchor:'bottom'});
    }

    Plotly.newPlot('gex-chart', [{
        type:'bar', orientation:'h', x:net, y:strikes, marker:{color:colors},
        customdata: d.strikes.map(function(s){return [s.call_gex, s.put_gex, s.oi];}),
        hovertemplate:'Strike %{y}<br>Net GEX: %{x:$,.0f}<br>Call: %{customdata[0]:$,.0f} · Put: %{customdata[1]:$,.0f}<br>OI: %{customdata[2]:,}<extra></extra>',
    }], Object.assign({}, DARK, {
        title:{text:'Gamma Exposure — ' + _sym + '  (' + (d.expirations||[]).join(', ') + ')', font:{size:13,color:'#aaa'}},
        xaxis:Object.assign({}, DARK.xaxis, {title:'Net GEX ($ / 1% move)'}),
        yaxis:Object.assign({}, DARK.yaxis, {title:'Strike', autorange:true}),
        shapes:shapes, annotations:annos, showlegend:false, bargap:0.15,
    }), {displayModeBar:false, responsive:true});

    document.getElementById('gex-chart').on('plotly_click', function(ev) {
        if (ev.points && ev.points.length) loadDrill(ev.points[0].y);
    });
}

function renderTable(d) {
    var rows = d.strikes.slice().sort(function(a,b){
        var av=a[_sortKey], bv=b[_sortKey];
        return (av<bv?-1:av>bv?1:0) * _sortDir;
    });
    var cols = [['strike','Strike'],['call_gex','Call'],['put_gex','Put'],['net_gex','Net'],['oi','OI']];
    var h = '<table class="gex-table"><thead><tr>';
    cols.forEach(function(c){ h += '<th onclick="sortTable(\''+c[0]+'\')">'+c[1]+(_sortKey===c[0]?(_sortDir>0?' ▲':' ▼'):'')+'</th>'; });
    h += '</tr></thead><tbody>';
    rows.forEach(function(s){
        var isSpot = Math.abs(s.strike - d.spot) < d.spot*0.005;
        var bg = isSpot ? 'background:rgba(245,158,11,0.12);' : '';
        h += '<tr style="'+bg+'" onclick="loadDrill('+s.strike+')">';
        h += '<td style="text-align:left;font-weight:600;">'+s.strike+'</td>';
        h += '<td class="pos">'+fmtGex(s.call_gex)+'</td>';
        h += '<td class="neg">'+fmtGex(s.put_gex)+'</td>';
        h += '<td class="'+(s.net_gex>=0?'pos':'neg')+'">'+fmtGex(s.net_gex)+'</td>';
        h += '<td>'+s.oi.toLocaleString()+'</td>';
        h += '</tr>';
    });
    h += '</tbody></table>';
    document.getElementById('gex-table-wrap').innerHTML = h;
}

function sortTable(key) {
    if (_sortKey === key) _sortDir = -_sortDir; else { _sortKey = key; _sortDir = 1; }
    if (_profile) renderTable(_profile);
}

function loadDrill(strike) {
    var wrap = document.getElementById('gex-drill');
    wrap.innerHTML = '<span style="color:#666;font-size:12px;">Loading contracts at '+strike+'…</span>';
    fetch('/api/options/drilldown/' + encodeURIComponent(_sym) + '?strike=' + strike + expsParam())
        .then(function(r){return r.json();}).then(function(d){
            if (d.error) { wrap.innerHTML = '<span style="color:#f33;">'+d.error+'</span>'; return; }
            var h = '<div style="font-size:13px;font-weight:700;margin-bottom:6px;">Contracts behind strike $'+d.strike+'</div>';
            h += '<table class="gex-table" style="max-width:680px;"><thead><tr>';
            ['Expiration','Side','OI','IV','Gamma','GEX'].forEach(function(c,i){ h += '<th style="text-align:'+(i<2?'left':'right')+';">'+c+'</th>'; });
            h += '</tr></thead><tbody>';
            d.contracts.forEach(function(c){
                h += '<tr>';
                h += '<td style="text-align:left;">'+c.expiration+'</td>';
                h += '<td style="text-align:left;" class="'+(c.side==='call'?'pos':'neg')+'">'+c.side.toUpperCase()+'</td>';
                h += '<td>'+c.oi.toLocaleString()+'</td>';
                h += '<td>'+(c.iv!=null?(c.iv*100).toFixed(1)+'%':'—')+'</td>';
                h += '<td>'+c.gamma.toFixed(4)+'</td>';
                h += '<td class="'+(c.gex>=0?'pos':'neg')+'">'+fmtGex(c.gex)+'</td>';
                h += '</tr>';
            });
            h += '</tbody></table>';
            wrap.innerHTML = h;
        }).catch(function(e){ wrap.innerHTML = '<span style="color:#f33;">'+e.message+'</span>'; });
}

function renderDisclosure(d) {
    var a = d.assumptions || {};
    var m = d.meta || {};
    var h = '';
    h += 'Fetched ' + (m.fetched_at||'?') + ' · OI as of ' + (m.oi_as_of||'?') + '. ';
    h += 'GEX = Γ × OI × 100 × S² × 0.01 × (calls +1 / puts −1), summed over the next ' + ((d.expirations||[]).length) + ' expirations; units: ' + (a.units||'') + '. ';
    h += 'Assumptions (estimates, not exact facts): risk-free ' + (a.risk_free) + ', dividend yield ' + (a.dividend_yield) + ', dealer positioning ' + (a.dealer_positioning) + '. ';
    h += 'Gamma is Black-Scholes from yfinance implied volatility; open interest is ' + (a.oi_basis||'prior-session EOD') + ' and lags intraday.';
    document.getElementById('gex-disclosure').textContent = h;
}

document.addEventListener('DOMContentLoaded', function(){ loadGEX(); });
</script>
{% endblock %}
